  <script>
    async function FetchingData() {
      let data = await fetch("https://fakestoreapi.com/products");
      let finalData = await data.json();
      Rendering(finalData);
     
      

      function Rendering(finalData) {
        
        let main = document.getElementsByTagName("main")[0];
        main.innerHTML=''
        finalData.map((items) => {
          let Card = document.createElement("div");
          Card.className = "card";

          Card.innerHTML = `<u><img src=${items.image} /></u>
                          <p>${items.title.slice(0, 10)}</p>
                          <h1>Price:$${items.price}</h1>
                           <button class='button1'>Veiw-Info</button>  `;

          main.appendChild(Card);

          let BuutonData = Card.getElementsByClassName("button1")[0];
          BuutonData.addEventListener("click", () => {
            showpop(items);
          });
        });
      }

      let InputData = document.getElementsByTagName("input")[0];
      InputData.addEventListener("keyup", handleSearch);
      let SearchData = "";

      //  With These Help of this We can Actualyy Get The Data
      function handleSearch(e) {
        SearchData = e.target.value.toLowerCase();
        console.log(SearchData);
       
   let Result=   finalData.filter((items)=>{
    return  items.category.includes(SearchData)
        
      })
      Rendering(Result)
      

      
      }
    }
    FetchingData();
    function showpop(items) {
      const div = document.createElement("div");
      div.className = "popup";
      div.innerHTML = `<img src=${items.image} />
                          <p>${items.title.slice(0, 10)}</p> 
                          <h1>Price:$${items.price}</h1> 
                            <p>Rating:${items.rating.rate}</p>
                             <button  class='button2' >Close</button>`;
      document.body.append(div);

      let bt2 = document.getElementsByClassName("button2")[0];
      bt2.addEventListener("click", () => {
        div.remove();
      });
    }
  </script>
</html>
