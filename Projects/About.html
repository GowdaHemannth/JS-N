<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Store</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:#f5f6fa;
}

/* NAVBAR */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 80px;
background:#1e1e2f;
color:white;
}

.logo{
font-size:24px;
font-weight:bold;
}

.menu a{
margin-left:25px;
text-decoration:none;
color:white;
font-size:16px;
}

/* MAIN PRODUCT SECTION */

.About{
display:flex;
align-items:center;
justify-content:center;
gap:120px;
padding:80px;
min-height:80vh;
}

/* IMAGE */

.AboutRight img{
width:420px;
border-radius:15px;
box-shadow:0px 10px 30px rgba(0,0,0,0.2);
}

/* PRODUCT INFO */

.Info{
display:flex;
flex-direction:column;
gap:18px;
max-width:400px;
}

.Info h1{
font-size:32px;
color:#222;
}

.Info p{
color:#555;
font-size:18px;
}

/* PRICE */

.price{
font-size:28px;
font-weight:bold;
color:#6a5cff;
}

/* VARIANTS */

.mobile{
display:flex;
gap:20px;
margin-top:10px;
}

.mobileBox{
border:1px solid #ddd;
height:90px;
width:160px;
display:flex;
align-items:center;
justify-content:center;
border-radius:10px;
background:white;
cursor:pointer;
transition:0.3s;
}

.mobileBox:hover{
border:1px solid #6a5cff;
transform:translateY(-4px);
box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

/* BUTTONS */

.buttons{
margin-top:20px;
display:flex;
gap:20px;
}

.btn{
padding:12px 25px;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

.cart{
background:#ff9f00;
color:white;
}

.buy{
background:#6a5cff;
color:white;
}

/* FEATURES */

.features{
display:flex;
justify-content:center;
gap:60px;
padding:60px;
background:white;
}

.featureBox{
text-align:center;
max-width:200px;
}

.featureBox h3{
margin-bottom:10px;
}

/* FOOTER */

footer{
background:#1e1e2f;
color:white;
text-align:center;
padding:25px;
margin-top:40px;
}

</style>
</head>

<body>



<!-- PRODUCT SECTION -->

<div class="About">

<div class="AboutRight">
<img src="https://rukminim1.flixcart.com/image/1536/1536/xif0q/mobile/3/n/p/-original-imahcfcfwzp8sydh.jpeg?q=90">
</div>

<div class="Info">

<p><u>Selected Color: Grey</u></p>

<h1>iPhone 15 Pro</h1>

<p class="price">₹79,999</p>

<p>Variant Type</p>

<div class="mobile">

<div class="mobileBox"><b>128GB + 8GB</b></div>

<div class="mobileBox"><b>256GB + 8GB</b></div>

</div>

<div class="buttons">
<button class="btn cart">Add To Cart</button>
<button class="btn buy">Buy Now</button>
</div>

</div>

</div>





</body>
</html>
